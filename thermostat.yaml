#########
template:
  #######

  #######
  - binary_sensor:
      #######

      ###########
      - name: "Пора калибровать температуру"
        delay_on:
          minutes: 1
        delay_off:
          minutes: 1
        state: >
          {% if (state_attr('climate.0x842e14fffe5a3002', 'current_temperature')|float(0) - states('sensor.temperatura_v_spalne')|float(0))|abs|round(2) >= 0.5 %}
          on
          {% else %}
          off
          {% endif %}
        device_class: "heat"

