  ####
  - alias: "TemperatureAtNightFloor"
    trigger:
      - platform: time
        at: "22:00:00"
    action:
      - service: climate.set_temperature
        target:
          entity_id:
            - climate.loggia_warmfloor #теплый пол на лоджии
        data:
          temperature: 18
          hvac_mode: heat

  ####
  - alias: "TemperatureAtDayFloor"
    trigger:
      - platform: time
        at: "09:00:00"
    action:
      - service: climate.set_temperature
        target:
          entity_id:
            - climate.loggia_warmfloor #теплый пол на лоджии
        data:
          temperature: 29
          hvac_mode: heat

########
climate: #Климат
  ########

  ####
  - platform: generic_thermostat
    name: "Кухня"
    heater: switch.loggia_din01 # KitchenSwitchThermostat
    target_sensor: sensor.sredniaia_temperatura_na_kukhni_i_lodzhii
    min_temp: 18
    max_temp: 27
    target_temp: 24
    ac_mode: false
    initial_hvac_mode: "heat"
    precision: 0.5
    cold_tolerance: 0.2
    hot_tolerance: 0.3
    keep_alive:
      minutes: 30

  ####
  - platform: generic_thermostat
    name: "Гостиная"
    heater: switch.hall_socketx4_01_l3
    target_sensor: sensor.hall_temperature
    min_temp: 20
    max_temp: 27
    target_temp: 24
    ac_mode: false
    min_cycle_duration:
      seconds: 180
    initial_hvac_mode: "heat"
    precision: 0.5
    cold_tolerance: 0.2
    hot_tolerance: 0.3
    keep_alive:
      minutes: 30
