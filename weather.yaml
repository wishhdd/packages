#########
automation: #Автоматизации
  #########
  - alias: "Погода: Утренний отчет и Сохранение прогноза"
    id: 2509171722
    description: "В 7:00 получает прогноз, шлет отчет в Telegram и сохраняет данные"
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      # --- ШАГ 1: Получаем прогноз (1 API запрос) ---
      - service: weather.get_forecasts
        target:
          entity_id: weather.yandexweather
        data:
          type: hourly
        response_variable: hourly_forecast
      # --- ШАГ 2: Готовим переменные ---
      - variables:
          weather_entity: "weather.yandexweather"
          translations:
            clear: "Ясно"
            sunny: "Солнечно"
            cloudy: "Облачно"
            overcast: "Пасмурно"
            "partly-cloudy": "Переменная облачность"
            rain: "Дождь"
            "light-rain": "Небольшой дождь"
            "heavy-rain": "Сильный дождь"
            showers: "Ливень"
            "wet-snow": "Мокрый снег"
            "light-snow": "Небольшой снег"
            snow: "Снег"
            "snow-showers": "Снегопад"
            hail: "Град"
            thunderstorm: "Гроза"
            "thunderstorm-with-rain": "Дождь с грозой"
            "thunderstorm-with-hail": "Гроза с градом"
            partlycloudy: "Переменная облачность"
      - service: notify.telegram
        data:
          title: "Прогноз погоды."
          message: |
            {%- set bearing = state_attr(weather_entity, 'wind_bearing') -%}
            {%- set directions = ['Северный', 'Северо-восточный', 'Восточный', 'Юго-восточный', 'Южный', 'Юго-западный', 'Западный', 'Северо-западный', 'Северный'] -%}
            {%- set wind_direction = directions[((bearing + 22.5) / 45) | int] if bearing is not none else '' -%}
            {%- set current_condition_key = state_attr(weather_entity, 'yandex_condition') | lower -%}
            {%- set yandex_condition_ru = translations[current_condition_key] | default(current_condition_key | capitalize) -%}
            За окном: {{ yandex_condition_ru }}.
            🌡️ Температура      {{ state_attr(weather_entity, 'temperature') | default('N/A') }}°C.
            {% if state_attr(weather_entity, 'feels_like') is not none -%}
            🌡️ Ощущается как  {{ state_attr(weather_entity, 'feels_like') }}°C.
            {% endif -%}
            🌡️ По датчику         {{ states('sensor.street_sensor02_temperature') }}°C.

            🌬️ Ветер: {{ wind_direction }} {{ state_attr(weather_entity, 'wind_speed') | default('N/A') }} м/с.

            *Прогноз на день:*
              {% if hourly_forecast[weather_entity] is defined and hourly_forecast[weather_entity].forecast | length > 0 %}
              {%- set forecast_data = namespace(m9=none, d13=none, a17=none, e21=none, n23=none) -%}
              {%- for hour in hourly_forecast[weather_entity].forecast -%}
              {%- set h = (hour.datetime | as_datetime | as_local).hour -%}
              {%- if h == 9 %}{%- set forecast_data.m9 = "🌅 Утром (09:00): %s°C, %s." | format(hour.temperature, translations[hour.condition | lower] | default(hour.condition | capitalize)) -%}{%- endif -%}
              {%- if h == 13 %}{%- set forecast_data.d13 = "☀️ Днем (13:00): %s°C, %s." | format(hour.temperature, translations[hour.condition | lower] | default(hour.condition | capitalize)) -%}{%- endif -%}
              {%- if h == 17 %}{%- set forecast_data.a17 = "🌆 К вечеру (17:00): %s°C, %s." | format(hour.temperature, translations[hour.condition | lower] | default(hour.condition | capitalize)) -%}{%- endif -%}
              {%- if h == 21 %}{%- set forecast_data.e21 = "🌃 Вечером (21:00): %s°C, %s." | format(hour.temperature, translations[hour.condition | lower] | default(hour.condition | capitalize)) -%}{%- endif -%}
              {%- if h == 23 %}{%- set forecast_data.n23 = "🌙 Ночью (23:00): %s°C, %s." | format(hour.temperature, translations[hour.condition | lower] | default(hour.condition | capitalize)) -%}{%- endif -%}
              {%- endfor -%}
              {{ forecast_data.m9 }}
              {{ forecast_data.d13 }}
              {{ forecast_data.a17 }}
              {{ forecast_data.e21 }}
              {{ forecast_data.n23 }}
            {%- endif %}
          data:
            parse_mode: markdown
      # --- ШАГ 4: Сохраняем тот же самый прогноз в помощников ---
      - repeat:
          for_each: "{{ hourly_forecast['weather.yandexweather'].forecast }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ (repeat.item.datetime | as_datetime | as_local).hour in [9, 13, 17, 21, 23] }}"
                  sequence:
                    - service: input_number.set_value
                      target:
                        entity_id: input_number.forecast_temp_{{ "%02d" | format((repeat.item.datetime | as_datetime | as_local).hour) }}
                      data:
                        value: "{{ repeat.item.temperature }}"
                    - service: input_text.set_value
                      target:
                        entity_id: input_text.forecast_condition_{{ "%02d" | format((repeat.item.datetime | as_datetime | as_local).hour) }}
                      data:
                        value: >
                          {% set condition_from_api = repeat.item.condition %}
                          {% if condition_from_api is not none and condition_from_api != "" %}
                            {{ translations[condition_from_api | lower] | default(condition_from_api | capitalize) }}
                          {% else %}
                            Неизвестно
                          {% endif %}
    mode: single

  ###
  - alias: "Погода: Проверка изменений (Улучшенная)"
    id: 2509171724
    description: "Раз в несколько часов проверяет прогноз для будущих временных слотов и присылает одно сводное уведомление при отличиях."
    trigger:
      - platform: time
        at:
          - "08:55:00"
          - "10:55:00"
          - "12:55:00"
          - "14:55:00"
          - "16:55:00"
          - "18:55:00"
          - "20:55:00"
          - "22:55:00"
    action:
      # --- ШАГ 1: Получаем свежий прогноз ---
      - service: weather.get_forecasts
        target:
          entity_id: weather.yandexweather
        data:
          type: hourly
        response_variable: hourly_forecast

      # --- ШАГ 2: Анализируем прогноз, ищем отличия от сохраненного и готовим данные ---
      - variables:
          change_data: >
            {% set data = namespace(lines=[], temp_updates={}, cond_updates={}) %}
            {% set translations = {
              'clear': 'Ясно', 'sunny': 'Солнечно', 'cloudy': 'Облачно',
              'overcast': 'Пасмурно', 'partly-cloudy': 'Переменная облачность',
              'rain': 'Дождь', 'light-rain': 'Небольшой дождь', 'heavy-rain': 'Сильный дождь',
              'showers': 'Ливень', 'wet-snow': 'Мокрый снег', 'light-snow': 'Небольшой снег',
              'snow': 'Снег', 'snow-showers': 'Снегопад', 'hail': 'Град',
              'thunderstorm': 'Гроза', 'thunderstorm-with-rain': 'Дождь с грозой',
              'thunderstorm-with-hail': 'Гроза с градом', 'partlycloudy': 'Переменная облачность'
            } %}
            {% for hour in hourly_forecast.get('weather.yandexweather', {}).get('forecast', []) %}
              {% set h = (hour.datetime | as_datetime | as_local).hour %}
              {# Проверяем только нужные часы И только те, что еще не наступили #}
              {% if h in [9, 13, 17, 21, 23] and h > now().hour %}
                {% set saved_temp = states('input_number.forecast_temp_' ~ '%02d' | format(h)) | float(0) %}
                {% set saved_condition = states('input_text.forecast_condition_' ~ '%02d' | format(h)) %}
                {% set current_temp = hour.temperature %}
                {% set condition_from_api = hour.condition %}
                {% set current_cond_ru = translations.get(condition_from_api | lower, condition_from_api | capitalize) if condition_from_api else "Неизвестно" %}

                {# Условие изменения: температура отличается на 3+ градуса ИЛИ изменилось состояние погоды #}
                {% if (current_temp - saved_temp) | abs >= 3 or current_cond_ru != saved_condition %}
                  {% set line = "• На " ~ h ~ ":00 было " ~ saved_temp ~ "°C (" ~ saved_condition ~ "), стало " ~ current_temp ~ "°C (" ~ current_cond_ru ~ ")." %}
                  {% set _ = data.lines.append(line) %}

                  {# Готовим данные для обновления помощников #}
                  {% set t_updates = data.temp_updates %}
                  {% set _ = t_updates.update({h: current_temp}) %}
                  {% set c_updates = data.cond_updates %}
                  {% set _ = c_updates.update({h: current_cond_ru}) %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ {'lines': data.lines, 'temps': data.temp_updates, 'conds': data.cond_updates} }}

      # --- ШАГ 3: Если были найдены изменения, отправляем одно уведомление и обновляем помощников ---
      - if:
          - condition: template
            value_template: "{{ change_data.lines | length > 0 }}"
        then:
          # 3a. Отправляем одно сводное уведомление
          - service: notify.telegram
            data:
              title: "⚠️ Изменение прогноза погоды!"
              message: |
                {% for line in change_data.lines %}
                {{ line }}
                {% endfor %}

          # 3b. Обновляем помощников с температурой
          - repeat:
              for_each: "{{ change_data.temps.items() }}"
              sequence:
                - service: input_number.set_value
                  target:
                    entity_id: "input_number.forecast_temp_{{ '%02d' | format(repeat.item.key) }}"
                  data:
                    value: "{{ repeat.item.value }}"

          # 3c. Обновляем помощников с состоянием погоды
          - repeat:
              for_each: "{{ change_data.conds.items() }}"
              sequence:
                - service: input_text.set_value
                  target:
                    entity_id: "input_text.forecast_condition_{{ '%02d' | format(repeat.item.key) }}"
                  data:
                    value: "{{ repeat.item.value }}"
    mode: single
