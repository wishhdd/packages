# ===============================================================
# 1. СОЗДАНИЕ ПЕРЕМЕННЫХ (ХЕЛПЕРЫ)
# ВАЖНО: Этот файл должен быть подключен как Package.
# Если это не Package, а просто include в automation, то
# разделы input_datetime и input_boolean надо перенести в configuration.yaml
# ===============================================================

input_datetime:
  last_vacuum_run:
    name: "Дата последней уборки"
    has_date: true
    has_time: true
    icon: mdi:calendar-clock

input_boolean:
  i_will_vacuum:
    name: "Разрешение на уборку (Флаг)"
    icon: mdi:robot-vacuum

# ===============================================================
# 2. АВТОМАТИЗАЦИИ
# ===============================================================
automation:
  # -------------------------------------------------------------
  # 1. РАННЕЕ УТРО: ПРОВЕРКА ДАТЫ (07:00)
  # -------------------------------------------------------------
  - id: "vacuum_check_schedule_0700"
    alias: "Робот - 1. Проверка графика (07:00)"
    trigger:
      - platform: time
        at: "07:00:00"
    condition:
      - condition: template
        value_template: >
          {% set last_run = states('input_datetime.last_vacuum_run') %}
          {% if last_run not in ['unknown', 'unavailable'] %}
            {{ (as_timestamp(now()) - as_timestamp(last_run)) > 216000 }}
          {% else %}
            true
          {% endif %}
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.i_will_vacuum

  # -------------------------------------------------------------
  # 2. УТРО: ПРЕДУПРЕЖДЕНИЕ (07:20)
  # -------------------------------------------------------------
  - id: "vacuum_notify_early_0720"
    alias: "Робот - 2. Утреннее уведомление (07:20)"
    trigger:
      - platform: time
        at: "07:20:00"
    condition:
      - condition: state
        entity_id: input_boolean.i_will_vacuum
        state: "on"
      - condition: state
        entity_id: binary_sensor.semia_doma
        state: "on"
    action:
      - service: notify.telegram
        data:
          title: "📅 Планы на день"
          message: >
            Доброе утро!
            Прошло 3 дня, поэтому сегодня будет уборка.
            Робот стартует, когда все уйдут, или в 11:00.

  # -------------------------------------------------------------
  # 3. ДЕНЬ: НАПОМИНАНИЕ (10:30)
  # -------------------------------------------------------------
  - id: "vacuum_notify_warning_1030"
    alias: "Робот - 3. Уведомление перед стартом (10:30)"
    trigger:
      - platform: time
        at: "10:30:00"
    condition:
      - condition: state
        entity_id: input_boolean.i_will_vacuum
        state: "on"
      - condition: state
        entity_id: binary_sensor.semia_doma
        state: "on"
      # ИСПРАВЛЕНО: to -> state
      - condition: state
        entity_id: vacuum.xiaomi_b106eu_4f70_robot_cleaner_2
        attribute: status
        state: "docked"
    action:
      - service: notify.telegram
        data:
          title: "🧹 Время уборки!"
          message: >
            Напоминаю: старт уборки через 30 минут (в 11:00).
            Пожалуйста, поднимите вещи с пола!

  # -------------------------------------------------------------
  # 4. ДЕНЬ: АВТО-СТАРТ (11:00)
  # -------------------------------------------------------------
  - id: "vacuum_start_schedule_1100"
    alias: "Робот - 4. Запуск по таймеру (11:00)"
    trigger:
      - platform: time
        at: "11:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.i_will_vacuum
        state: "on"
      - condition: state
        entity_id: binary_sensor.semia_doma
        state: "on"
      # ИСПРАВЛЕНО: to -> state
      - condition: state
        entity_id: vacuum.xiaomi_b106eu_4f70_robot_cleaner_2
        attribute: status
        state: "docked"
    action:
      - service: vacuum.start
        target:
          entity_id: vacuum.xiaomi_b106eu_4f70_robot_cleaner_2

  # -------------------------------------------------------------
  # 5. ЛЮБОЕ ВРЕМЯ: СТАРТ ПРИ УХОДЕ
  # -------------------------------------------------------------
  - id: "vacuum_start_on_leave"
    alias: "Робот - 5. Запуск при уходе из дома"
    trigger:
      - platform: state
        entity_id: binary_sensor.semia_doma
        to: "off"
    condition:
      - condition: state
        entity_id: binary_sensor.den
        state: "on"
      - condition: state
        entity_id: input_boolean.i_will_vacuum
        state: "on"
      # ИСПРАВЛЕНО: to -> state (Именно здесь была ошибка с картинки)
      - condition: state
        entity_id: vacuum.xiaomi_b106eu_4f70_robot_cleaner_2
        attribute: status
        state: "docked"
    action:
      - service: vacuum.start
        target:
          entity_id: vacuum.xiaomi_b106eu_4f70_robot_cleaner_2

  # -------------------------------------------------------------
  # 6. ФИНАЛ: УБОРКА ЗАВЕРШЕНА
  # -------------------------------------------------------------
  - id: "vacuum_log_success"
    alias: "Робот - 6. Фиксация успешной уборки"
    trigger:
      - platform: state
        entity_id: vacuum.xiaomi_b106eu_4f70_robot_cleaner_2
        attribute: status
        to: "docked"
        for: "00:00:10"
    condition:
      - condition: state
        entity_id: input_boolean.i_will_vacuum
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.i_will_vacuum
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_vacuum_run
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
