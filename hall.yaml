###########
timer:
  ###########
  small_light:
    duration: "00:20:00"
###########
automation: #Автоматизации
  ##############

  ####
  - alias: "btnClick" # при клике на кнопку переключает настольную лампу
    trigger:
      - platform: mqtt
        topic: zigbee2mqtt/hall_btn01
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.action == 'single' }}"
    action:
      - service: switch.toggle
        target:
          entity_id: switch.hall_socketx4_01_l5

  ###
  - alias: startSmallLigthTimer #  Запускаем таймер ночника
    trigger:
      - platform: state
        entity_id:
          - switch.hall_socketx4_01_l5
        to: "on"
    action:
      - service: timer.start
        target:
          entity_id: timer.small_light

  ###
  - alias: stopSmallLigthTimer #  Останавливаем таймер ночника
    trigger:
      - platform: state
        entity_id:
          - switch.hall_socketx4_01_l5
        to: "off"
    action:
      - service: timer.cancel
        target:
          entity_id: timer.small_light

  ###
  - alias: endSmallLigthTimer #  таймер ночника подошел к концу
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.small_light
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.hall_socketx4_01_l5

  ####
  - alias: " turnoff_heating_hall_if_window_open" # Выклчаем отопление если окно открыто
    trigger:
      platform: state
      entity_id: binary_sensor.hall_sensor05_contact
      to: "on"
      for:
        minutes: 1
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id:
            - climate.gostinaia # Батарея в зале
        data:
          hvac_mode: "off"

  ####
  - alias: " turnon_heating_hall_if_window_close" # Вклчаем отопление если окно закрыто
    trigger:
      platform: state
      entity_id: binary_sensor.hall_sensor05_contact
      to: "off"
      for:
        minutes: 1
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id:
            - climate.gostinaia # Батарея в зале
        data:
          hvac_mode: "heat"

  ####
  - alias: "turnoff_battery_light_when_central_light_turnedon" # выклчаем свет батареи когда включе оснвной свет
    trigger:
      platform: state
      entity_id: switch.0x847127fffe9f5082_left #цетральный свет
      to: "on"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.hall_socketx4_01_l2

  ####
  - alias: "turnOnBatteryLightWhenTurningOffTV" #включаем свет батареи при выклчюении телевизора
    trigger:
      platform: state
      entity_id: sensor.televizor_v_zale #Телевизор в зале
      to: "standby"
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: sun.sun
          state: "below_horizon"
        - condition: state
          entity_id: switch.0x847127fffe9f5082_left #свет зал центральный
          state: "off"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.hall_socketx4_01_l2 #свет в батареи

  ####
  - alias: "switchRadiatorLight" #Переключаем подстветку батареии при нажатии правой кнопки выключателя
    trigger:
      platform: state
      entity_id: switch.hall_switch01_right
      to: "on"
    action:
      - service: switch.toggle
        target:
          entity_id:
            - switch.hall_socketx4_01_l2
      - delay: 1
      - service: switch.turn_off
        target:
          entity_id: switch.hall_switch01_right

  ####
  - alias: "Switch the left ceiling light" #Переключить левый потолочный свет
    trigger:
      - platform: mqtt
        topic: zigbee2mqtt/hall_btn02
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.action == '1_single' }}"
    action:
      - service: switch.toggle
        target:
          entity_id:
            - switch.hall_switch01_left

  ####
  - alias: "Switch the center ceiling light" #Переключить центральный потолочный свет
    trigger:
      - platform: mqtt
        topic: zigbee2mqtt/hall_btn02
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.action == '2_single' }}"
    action:
      - service: switch.toggle
        target:
          entity_id:
            - switch.hall_switch01_center

  ####
  - alias: "Switch btnClick" #Переключить ночной свет
    trigger:
      - platform: mqtt
        topic: zigbee2mqtt/hall_btn02
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.action == '3_single' }}"
    action:
      - service: switch.toggle
        target:
          entity_id:
            - switch.hall_socketx4_01_l5

  ####
  - alias: "Switch the switchRadiatorLight" #Переключить свет в батареи
    trigger:
      - platform: mqtt
        topic: zigbee2mqtt/hall_btn02
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.action == '4_single' }}"
    action:
      - service: switch.toggle
        target:
          entity_id:
            - switch.hall_socketx4_01_l2

