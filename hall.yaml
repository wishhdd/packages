  - alias: "closeCurtainsWhenLightIsTurnedOn" #закрыть шторы при включение света
    trigger:
      - platform: state
        entity_id:
          - switch.hall_switch01_left
          - switch.hall_switch01_center
        to: "on"
    condition: "{{is_state('sun.sun', 'below_horizon')}}"
    action:
      - service: cover.close_cover
        target:
          entity_id: cover.0x842712fffeba18f7

  - alias: "openCurtainsWhenLightIsTurnedOn" #открываем шторы при включение света
    trigger:
      platform: state
      entity_id:
        - switch.hall_switch01_left
        - switch.hall_switch01_center
      to: "on"
    condition: "{{is_state('sun.sun', 'above_horizon')}}"
    action:
      - service: cover.open_cover
        target:
          entity_id: cover.0x842712fffeba18f7
